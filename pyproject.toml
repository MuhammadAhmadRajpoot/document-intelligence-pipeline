[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.1.0"
description = "Turn invoices, receipts and other business documents (PDF or images) into validated structured JSON."
readme = "README.md"
license = "MIT"
authors = [{ name = "Muhammad Ahmad" }]
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "rapidocr>=3.4",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.scripts]
docintel = "docintel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docintel = ["web/*", "web/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/docintel/cli.py" = ["B008"]
"src/docintel/api/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: hits the real Groq API (needs GROQ_API_KEY); run with -m integration"]
